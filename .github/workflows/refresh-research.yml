name: Verified research rebuild
on:
  workflow_dispatch:
    inputs:
      download:
        description: Download new provider data (historical revisions stop for review)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: northern-signal-production
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: research-production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate owner configuration
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Configure VERCEL_TOKEN in research-production'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'Configure VERCEL_ORG_ID'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Configure VERCEL_PROJECT_ID'; exit 1; }
      - name: Install tested research dependencies
        run: |
          python -m pip install -r requirements-research.txt
          npm install --global vercel@59.11.2
      - name: Restore prior pinned publication when available
        run: python scripts/restore_publication.py
      - name: Rebuild verified review
        env:
          DOWNLOAD: ${{ inputs.download }}
        run: |
          if [ "$DOWNLOAD" = true ]; then
            python scripts/rebuild_research.py --download
          else
            python scripts/rebuild_research.py
          fi
      - name: Required behavior tests
        run: |
          python -m pytest tests/test_research_v2.py tests/test_publication.py
          node --test tests/web.test.mjs
      - name: Prepare the validated static bundle
        run: python scripts/package_deployment.py
      - name: Preview complete artifact set
        run: |
          vercel deploy build/deploy --yes --token "$VERCEL_TOKEN" > build/preview-url.txt
          python scripts/verify_deployment.py "$(cat build/preview-url.txt)"
      - name: Promote the verified preview
        run: |
          python scripts/guard_publication.py https://canadian-bank-contagion-rl.vercel.app
          vercel promote "$(cat build/preview-url.txt)" --yes --token "$VERCEL_TOKEN"
          python scripts/verify_deployment.py https://canadian-bank-contagion-rl.vercel.app
      - name: Save complete published bundle
        if: success()
        run: |
          tar -czf build/published-release.tar.gz -C build/current .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: published-release
          path: build/published-release.tar.gz
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-build-evidence-${{ github.run_id }}
          path: |
            build/jobs
            build/preview-url.txt
            artifacts/current
          retention-days: 90
